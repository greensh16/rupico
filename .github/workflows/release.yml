name: Release

on:
  push:
    tags: ["v*"]
  # Lets you rehearse the build without cutting a release.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fails fast, before spending four platform builds on a mislabelled release.
  verify:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Compare versions
        run: |
          set -euo pipefail
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # A two-part tag such as v0.1 is accepted for Cargo's 0.1.0.
          if [[ "${TAG_VERSION}" != "${CARGO_VERSION}" \
             && "${TAG_VERSION}.0" != "${CARGO_VERSION}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${CARGO_VERSION}."
            echo "Bump the version in Cargo.toml (and commit Cargo.lock), or retag."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches Cargo.toml ${CARGO_VERSION}."

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Skipped on workflow_dispatch, where `verify` does not run.
    needs: [verify]
    if: always() && !contains(needs.*.result, 'failure')
    # Without this, a job requesting a runner label that no longer exists sits
    # queued indefinitely and the release never publishes.
    timeout-minutes: 45
    strategy:
      # One platform failing should not hide whether the others built.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest # Apple silicon, native
            target: aarch64-apple-darwin
          # Intel macOS is cross-compiled from the Apple-silicon runner: the
          # macOS SDK carries both slices, and the `macos-13` Intel runner has
          # been retired, so a job requesting it queues forever.
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      # serialport links libudev; eframe wants X11/Wayland/xkb.
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libudev-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      # `--locked` so a release is built from the committed Cargo.lock and not
      # from whatever resolved that day.
      # `--features gui` because the desktop app is an opt-in feature for
      # crates.io users, but downloaded release archives ship both binaries.
      - name: Build
        run: cargo build --release --locked --features gui --target ${{ matrix.target }}

      # Cross-compiling is easy to get silently wrong, so check the binary is
      # the architecture the asset name claims.
      - name: Verify architecture (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          EXPECTED="${{ matrix.target }}"
          EXPECTED="${EXPECTED%%-*}"   # x86_64 or aarch64
          ACTUAL=$(lipo -archs "target/${{ matrix.target }}/release/rupico")
          # lipo spells aarch64 as arm64.
          [[ "${EXPECTED}" == "aarch64" ]] && EXPECTED="arm64"
          if [[ "${ACTUAL}" != *"${EXPECTED}"* ]]; then
            echo "::error::Built ${ACTUAL} but the asset claims ${EXPECTED}."
            exit 1
          fi
          echo "rupico is ${ACTUAL}, as expected."

      # macOS ships the GUI as an .app bundle. A bare Unix executable
      # double-clicked in Finder is launched through Terminal, which puts a
      # terminal window in front of the app.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="rupico-${VERSION}-${{ matrix.target }}"
          APP="dist/${STAGE}/rupico.app"
          mkdir -p "${APP}/Contents/MacOS"

          cp "target/${{ matrix.target }}/release/rupico" "dist/${STAGE}/"
          cp "target/${{ matrix.target }}/release/rupico_gui" "${APP}/Contents/MacOS/rupico_gui"
          cp README.md LICENSE "dist/${STAGE}/"

          # Strip before signing: stripping afterwards invalidates the
          # signature.
          strip "dist/${STAGE}/rupico" "${APP}/Contents/MacOS/rupico_gui" || true

          cat > "${APP}/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>rupico</string>
            <key>CFBundleDisplayName</key><string>rupico</string>
            <key>CFBundleIdentifier</key><string>io.github.greensh16.rupico</string>
            <key>CFBundleExecutable</key><string>rupico_gui</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          # The heredoc above is indented for readability; strip that indent.
          sed -i '' 's/^          //' "${APP}/Contents/Info.plist"
          plutil -lint "${APP}/Contents/Info.plist"

          # Apple silicon refuses to run unsigned binaries at all. This ad-hoc
          # signature satisfies that; it is not Gatekeeper notarisation, so a
          # downloaded app still needs right-click -> Open the first time.
          codesign --force --sign - --timestamp=none "${APP}"
          codesign --verify --deep "${APP}"

          tar -C dist -czf "dist/${STAGE}.tar.gz" "${STAGE}"
          echo "ASSET=dist/${STAGE}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="rupico-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${STAGE}"
          cp "target/${{ matrix.target }}/release/rupico" "dist/${STAGE}/"
          cp "target/${{ matrix.target }}/release/rupico_gui" "dist/${STAGE}/"
          cp README.md LICENSE "dist/${STAGE}/"
          strip "dist/${STAGE}/rupico" "dist/${STAGE}/rupico_gui" || true

          # Lets desktop environments show the GUI in their app menus once the
          # binary is on PATH and this file is in ~/.local/share/applications.
          cat > "dist/${STAGE}/rupico.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=rupico
          GenericName=MicroPython IDE
          Comment=Edit, run and sync code on MicroPython boards
          Exec=rupico_gui
          Terminal=false
          Categories=Development;IDE;
          Keywords=micropython;pico;embedded;serial;
          DESKTOP
          sed -i 's/^          //' "dist/${STAGE}/rupico.desktop"

          tar -C dist -czf "dist/${STAGE}.tar.gz" "${STAGE}"
          echo "ASSET=dist/${STAGE}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}" -replace '^v', ''
          $stage = "rupico-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$stage" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/rupico.exe" "dist/$stage/"
          Copy-Item "target/${{ matrix.target }}/release/rupico_gui.exe" "dist/$stage/"
          Copy-Item README.md, LICENSE "dist/$stage/"
          Compress-Archive -Path "dist/$stage" -DestinationPath "dist/$stage.zip"
          "ASSET=dist/$stage.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    # Only a real tag produces a release; workflow_dispatch just rehearses the
    # build above.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          # Globbed explicitly rather than `*.tar.gz *.zip`: an unmatched glob
          # would be passed through literally and abort the step.
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) \
            -exec sha256sum {} + | sed 's| \./| |' > SHA256SUMS
          cat SHA256SUMS

      # `gh` is preinstalled on the runner, so this needs no third-party action.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A tag like v0.2.0-rc1 is published as a pre-release.
          PRERELEASE=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            PRERELEASE="--prerelease"
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            ${PRERELEASE} \
            dist/*
